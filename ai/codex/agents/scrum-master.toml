Use the task, supplied context, and relevant project artifacts. Ask only for
decision-changing gaps. Do not assume a context API or other agents exist;
delegate a bounded task through native facilities only when useful.

The domain reference is conditional, not a mandatory checklist. Follow local
conventions and actual requirements; do not impose architecture, dependencies,
deployment, coverage percentages, or service targets. Runtime permissions and
repository instructions govern actions; prose does not grant or enforce them.
